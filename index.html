<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Quick Edit — แก้ไข PDF ง่ายๆ ในเบราว์เซอร์</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="find">

<header id="topbar">
  <div class="brand">✂ PDF Quick Edit</div>
  <button id="openBtn" class="btn">เปิดไฟล์ PDF</button>
  <input type="file" id="fileInput" accept=".pdf,application/pdf" hidden>
  <span id="fileName" class="filename"></span>
  <div class="spacer"></div>
  <div id="docControls" class="controls" hidden>
    <button id="prevPage" class="btn small" title="หน้าก่อนหน้า">‹</button>
    <span id="pageLabel" class="pagelabel">–/–</span>
    <button id="nextPage" class="btn small" title="หน้าถัดไป">›</button>
    <span class="sep"></span>
    <button id="zoomOut" class="btn small" title="ย่อ">−</button>
    <span id="zoomLabel" class="pagelabel">100%</span>
    <button id="zoomIn" class="btn small" title="ขยาย">+</button>
    <span class="sep"></span>
    <button id="rotateBtn" class="btn small" title="หมุนหน้า 90°">หมุน</button>
  </div>
  <button id="saveBtn" class="btn primary" disabled>ดาวน์โหลด PDF ใหม่</button>
</header>

<div id="layout">
  <aside id="sidebar">
    <section class="panel">
      <h3>โหมดการแก้ไข</h3>
      <label class="radio"><input type="radio" name="mode" value="find" checked> คลิก/ค้นหาข้อความ</label>
      <label class="radio"><input type="radio" name="mode" value="draw"> วาดกรอบเอง</label>
      <p class="hint" id="modeHint"></p>
    </section>

    <section class="panel" id="findPanel">
      <h3>ค้นหาข้อความ</h3>
      <input type="text" id="searchInput" placeholder="พิมพ์คำ เช่น ราคา วันที่ ชื่อ…" autocomplete="off">
      <div id="searchInfo" class="hint"></div>
    </section>

    <section class="panel" id="editPanel">
      <h3>ข้อความใหม่</h3>
      <div id="selectionInfo" class="hint"></div>
      <textarea id="newText" rows="3" placeholder="พิมพ์ข้อความใหม่ที่จะวางทับ (ขึ้นบรรทัดใหม่ได้ด้วย Enter)"></textarea>
      <div class="row">
        <button id="addEditBtn" class="btn primary" disabled>เพิ่มการแก้ไข</button>
        <button id="cancelSelBtn" class="btn">ยกเลิก</button>
      </div>
    </section>

    <section class="panel" id="editsPanel">
      <h3>รายการแก้ไข (<span id="editCount">0</span>)</h3>
      <ul id="editList"></ul>
      <p class="hint" id="editsHint">ไฟล์ต้นฉบับจะไม่ถูกแตะ — ดาวน์โหลดเป็นไฟล์ใหม่ตอนจบ</p>
    </section>
  </aside>

  <main id="viewer">
    <div id="emptyState">
      <div class="empty-box">
        <div class="empty-icon">📄</div>
        <p>ลากไฟล์ PDF มาวางที่นี่<br>หรือกดปุ่ม <b>เปิดไฟล์ PDF</b></p>
        <p class="hint">ทำงานออฟไลน์ 100% — ไฟล์ไม่ออกจากเครื่อง</p>
      </div>
    </div>
    <div id="canvasWrap" hidden>
      <canvas id="pdfCanvas"></canvas>
      <div id="textLayer"></div>
      <div id="drawLayer"></div>
      <div id="editOverlay"></div>
    </div>
  </main>
</div>

<script src="lib/pdf.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/sarabun-font.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>test</title></head>
<body>
<pre id="RESULT">running…</pre>
<script src="lib/pdf.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/sarabun-font.js"></script>
<script>
(async () => {
  const r = { protocol: location.protocol, pdfjsVer: (typeof pdfjsLib !== 'undefined') };
  // 1) fetch local font (fallback path in app.js loadFont)
  try {
    const res = await fetch('lib/Sarabun-Regular.ttf');
    r.fontFetch = res.ok ? 'OK ' + (await res.arrayBuffer()).byteLength + 'B' : 'HTTP ' + res.status;
  } catch (e) { r.fontFetch = 'FETCH-FAIL: ' + e.message; }
  // 2) pdf.js worker + open a PDF built in-page by pdf-lib
  try {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    const doc = await PDFLib.PDFDocument.create();
    const p = doc.addPage([300, 200]);
    p.drawText('hello', { x: 20, y: 100, size: 20, font: await doc.embedFont(PDFLib.StandardFonts.Helvetica) });
    const bytes = await doc.save();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(bytes).slice() }).promise;
    r.pdfjsOpen = 'OK pages=' + pdf.numPages;
    const pg = await pdf.getPage(1);
    const tc = await pg.getTextContent();
    r.textExtract = tc.items.map(i => i.str).join('').trim();
  } catch (e) { r.pdfjsOpen = 'FAIL: ' + (e && e.message); }
  // 3) embed Thai font from embedded base64 (the real app path) + draw
  try {
    const bin = atob(SARABUN_B64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const d2 = await PDFLib.PDFDocument.create();
    d2.registerFontkit(fontkit);
    const f = await d2.embedFont(buf.buffer);
    r.thaiFont = 'OK width=' + f.widthOfTextAtSize('ทดสอบ', 14).toFixed(1);
  } catch (e) { r.thaiFont = 'FAIL: ' + (e && e.message); }
  // 4) @font-face inject + CSS font ready (WYSIWYG preview)
  try {
    const st = document.createElement('style');
    st.textContent = `@font-face{font-family:'SarabunEmb';src:url(data:font/ttf;base64,${SARABUN_B64}) format('truetype');}`;
    document.head.appendChild(st);
    await document.fonts.load('16px SarabunEmb');
    r.previewFont = document.fonts.check('16px SarabunEmb') ? 'OK' : 'NOT-READY';
  } catch (e) { r.previewFont = 'FAIL: ' + (e && e.message); }
  // 5) IndexedDB autosave round-trip
  try {
    const open = () => new Promise((res, rej) => { const q = indexedDB.open('pdfquickedit_test', 1); q.onupgradeneeded = () => q.result.createObjectStore('s'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    const db = await open();
    const put = (k, v) => new Promise((res, rej) => { const tx = db.transaction('s', 'readwrite'); tx.objectStore('s').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
    const get = (k) => new Promise((res, rej) => { const tx = db.transaction('s', 'readonly'); const rq = tx.objectStore('s').get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
    await put('k', { a: 1, buf: new Uint8Array([1, 2, 3]) });
    const g = await get('k');
    r.indexedDB = (g && g.a === 1 && g.buf.length === 3) ? 'OK' : 'BAD';
  } catch (e) { r.indexedDB = 'FAIL: ' + (e && e.message); }
  // 6) page ops: rotate + delete round-trip via pdf-lib
  try {
    const d = await PDFLib.PDFDocument.create();
    for (let i = 0; i < 3; i++) d.addPage([200, 200]);
    const pages = d.getPages();
    pages[0].setRotation(PDFLib.degrees(90));
    d.removePage(1);
    const out = await d.save();
    const back = await PDFLib.PDFDocument.load(out);
    r.pageOps = 'OK pages=' + back.getPageCount() + ' rot0=' + back.getPages()[0].getRotation().angle;
  } catch (e) { r.pageOps = 'FAIL: ' + (e && e.message); }
  document.getElementById('RESULT').textContent = JSON.stringify(r, null, 1);
})();
</script>
</body></html>
